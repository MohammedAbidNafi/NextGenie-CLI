name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Smoke test
        run: |
          bun src/index.ts --version
          bun src/index.ts skill --print > /dev/null
          mkdir -p "$RUNNER_TEMP/app-test/app"
          cd "$RUNNER_TEMP/app-test"
          bun "$GITHUB_WORKSPACE/src/index.ts" create about "blog/[slug]" --loading
          bun "$GITHUB_WORKSPACE/src/index.ts" route "api/users/[id]"
          test -f app/about/page.jsx
          test -f "app/blog/[slug]/loading.jsx"
          test -f "app/api/users/[id]/route.js"

      - name: Check package contents
        run: npm pack --dry-run
